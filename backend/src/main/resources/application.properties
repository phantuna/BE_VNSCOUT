spring.datasource.url=jdbc:mysql://localhost:3306/VNScout?serverTimezone=Asia/Ho_Chi_Minh&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=8081
server.servlet.context-path=/vnscout
jwt.signerKey=DEVTERIA_SUPER_SECRET_KEY_2024_512_BIT
logging.level.org.springframework.security=DEBUG

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Jackson trả về datetime theo giờ Việt Nam
spring.jackson.time-zone=Asia/Ho_Chi_Minh

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key=${CLOUD_API_KEY}
cloudinary.api-secret:${CLOUD_API_SECRET}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=50MB

vietmap.api-key=${VIETMAP_API_KEY}
vietmap.base-url=https://maps.vietmap.vn/api
vietmap.reverse-display-type=6
vietmap.search-display-type=5

gemini.api.key=${GEMINI_API_KEY}

# PhoBERT Toxic Comment Moderation Service
moderation.toxic-comment-url=http://localhost:8000/check-toxic

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Spring Data Page serialization mode (tắt cảnh báo PageImpl, giữ cấu trúc JSON ổn định)
spring.data.web.pageable.serialization-mode=direct